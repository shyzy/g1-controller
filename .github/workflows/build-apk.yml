name: Build APK

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 查看仓库结构和 buildozer.spec 位置
        run: |
          echo "=== 仓库根目录文件 ==="
          ls -la
          echo ""
          echo "=== 是否有 buildozer.spec ==="
          find . -name "buildozer.spec" -type f
          echo ""
          echo "=== 完整目录树 ==="
          find . -not -path './.git/*' -not -name '.git'
