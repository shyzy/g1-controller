name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK with Buildozer
        run: |
          docker run --rm \
            -v "$(pwd):/app" \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -c "cd /app && echo y | buildozer -v android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G1-Controller-APK
          path: bin/*.apk
          if-no-files-found: error
